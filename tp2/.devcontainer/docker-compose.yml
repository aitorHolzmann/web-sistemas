services:
  database:
    image: postgres:15
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ es un escape para que Compose no intente interpolar esto al parsear el YAML;
      # la variable se resuelve adentro del contenedor, en runtime, via env_file.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ..:/workspace:cached
    command: sleep infinity

volumes:
  pgdata: